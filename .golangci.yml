version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - gocritic
    - misspell
    - unused
    - unparam
    - ineffassign
  settings:
    gosec:
      excludes:
        # G104: errors unchecked — errcheck owns this.
        - G104
        # G304: file inclusion via variable — CLI commands legitimately
        # take a --config path supplied by the operator. Auditing every
        # one of those reads is noise.
        - G304
        # G404: math/rand not crypto/rand — scheduler jitter and
        # similar non-security uses are intentional.
        - G404
    gocritic:
      disabled-checks:
        # ifElseChain — switch is not always more readable than a
        # short if-else chain. Leave it to the author.
        - ifElseChain
    revive:
      rules:
        # Skip "exported X should have comment" for typed-enum
        # constants — the type's doc comment covers the set, and
        # each constant has a meaningful name + inline trailing
        # comment where helpful.
        - name: exported
          disabled: true
        # Allow blank imports in non-main packages — golang-migrate's
        # database drivers ship as side-effect-only blank imports.
        - name: blank-imports
          disabled: true
        # SecretString is a deliberate stutter — secret.SecretString
        # reads at call sites the way we want it to.
        - name: var-naming
          disabled: true
        # Package-comment requirement: enforced by `exported` already;
        # disabling so the noise doesn't double up.
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocritic
          - revive
          - errcheck
          - unparam
      # Migration migrate.go intentionally blank-imports the pgx5 +
      # iofs drivers — exempt the whole file from blank-imports anyway
      # (belt-and-suspenders since the rule is disabled above).
      - path: internal/migrate/migrate\.go
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
