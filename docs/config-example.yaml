# toggle-monitor — example config
# Reference for hand-writing your ConfigMap. See docs/config-schema.md for the per-field reference.

# ── Top-level ─────────────────────────────────────────────────────────────────
displayTimezone: Asia/Kathmandu
publicBaseURL: https://monitor.internal.example.com
dbBodyMaxChars: 4000

httpClient:
  userAgent: "toggle-monitor/0.1 (+https://github.com/toggle-corp/toggle-monitor)"

ui:
  pageSize:
    homepageAlerts: 20
    monitorListing: 50
    monitorHistory: 50
    discoveryListing: 50
  maxPerPage: 200

theme:
  defaultGroupColor: "#64748b"

heartbeat:
  url: https://hc-ping.com/00000000-0000-0000-0000-000000000000
  interval: 1m
  failOnStalledWorker: true

# ── Database ──────────────────────────────────────────────────────────────────
# Non-secret values support ${VAR} interpolation (with optional defaults).
database:
  host: ${DB_HOST:-toggle-monitor-pg-rw.cnpg-system.svc.cluster.local}
  port: ${DB_PORT:-5432}
  user: ${DB_USER:-toggle_monitor}
  name: ${DB_NAME:-toggle_monitor}
  sslMode: require
  passwordEnv: DB_PASSWORD                          # secrets always via *Env, never inline

# ── Kube auto-discovery ───────────────────────────────────────────────────────
# `kube.match` is a *cascading rule tree*. For each (Ingress, host)
# pair, every rule whose `when:` matches contributes its `config:` to
# a merge stack; deeper / later wins for scalars, arrays union by
# default, `acceptedStatusCodes` replaces by default. Tag any array
# with `!override` to swap union for replace. `final: true` on a
# matching rule halts the cascade after descending into the rule's
# own `nested:` subtree. `ignore: true` suppresses materialization
# and records a `kube-ignored` row on /discovery.
#
# Full reference: docs/config-schema.md §4 and
# docs/adr/0002-kube-match-tree-cascade.md.
kube:
  resyncInterval: 30m

  # Auto-generated friendly name style for kube-discovered monitors.
  # Defaults to "compact" when omitted. Options:
  #   plain   → (ns) ingress-name                              (no magic)
  #   compact → (ns) ingress-name, with `-ingress` stripped    (default)
  #   dedupe  → also strip leading ingress tokens that already appear in ns
  #   title   → dedupe + Title Case With Spaces
  friendlyName: compact

  match:
    # ── Root rule (REQUIRED) ───────────────────────────────────────
    # Empty `when:` matches every (Ingress, host). Must carry every
    # required monitor field so any leaf-most match still produces a
    # valid monitor without additional input.
    - when: {}
      config:
        scheme: https
        path: /
        httpMethod: GET
        acceptedStatusCodes: [200]
        interval: 5m
        timeout: 10s
        retries: 2
        retryBackoff: 5s
        followRedirects: false
        reminderInterval: 3d
        sslAlertThreshold: 30d
        sslEscalationThreshold: 7d
        sslReminderInterval: 3d
        slack: ops-alerts
        notify: [ops-team]

    # ── Cluster-wide kill switch ───────────────────────────────────
    # Any Ingress labeled `monitor.togglecorp.com/disabled=true` is
    # suppressed. `final: true` prevents any later rule (e.g., an
    # app-specific override) from un-ignoring it.
    - when:
        labels:
          monitor.togglecorp.com/disabled: "true"
      ignore: true
      final: true

    # ── Skip short-lived test namespaces ───────────────────────────
    # `ignore:` cascades like a scalar, so a child can flip it back
    # to `false` to un-ignore a specific subset (e.g., test-critical-*).
    - when: { namespace: "test-*" }
      ignore: true

    # ── ACME namespace family ──────────────────────────────────────
    # Notice the layering: this rule sets project-wide group + notify;
    # the nested regex rule narrows to the Service-A sub-family; the
    # deepest rule pins the per-app health-check path for minio
    # Ingresses inside that sub-family.
    - when: { namespace: "acme-*" }
      config:
        group: acme
        notify: [alice]                              # unions with root's [ops-team]
        tags: [acme]
      nested:
        - when: { namespaceRegex: "acme-service-a-eoapi-\\d+" }
          config:
            tags: [service-a, eoapi]                 # unions → [acme, service-a, eoapi]
          nested:
            - when:
                labels:
                  app.kubernetes.io/name: minio
              config:
                path: /minio/health/live
                # `final: true` here prevents a later top-level
                # "global minio" rule (below) from clobbering the
                # project-specific `path` for this Ingress.
              final: true

    # ── BETACO namespace family ──────────────────────────────────────
    # Production hosts get the public-API slack channel; everything
    # else stays on ops-alerts (inherited from root).
    - when: { namespace: "betaco-core-backend-*" }
      config:
        group: production-apis
        tags: [betaco, internal]
        dependsOn: [bastion-proxy]
      nested:
        - when: { host: "*.example.com" }
          config:
            slack: ops-alerts
            notify: !override [ops-team, alice]      # replaces inherited notify, doesn't union

    # ── Global minio convention ────────────────────────────────────
    # Any Ingress labeled as a minio app, anywhere in the cluster,
    # gets the standard health path. Project-specific rules above can
    # use `final: true` to opt out (see the ACME subtree).
    - when:
        labels:
          app.kubernetes.io/name: minio
      config:
        path: /minio/health/live
        acceptedStatusCodes: [200]                   # replace-by-default for this field

    # ── Public web fallback for dev-environment hosts ──────────────
    - when: { host: "*.example.com" }
      config:
        acceptedStatusCodes: [200, 301, 302]
        timeout: 15s
        retries: 3
        retryBackoff: 10s
        group: public

# ── Slack ─────────────────────────────────────────────────────────────────────
slack:
  bodyMaxChars: 200
  summaryChannel: ops-summary                       # weekly operational summary lands here
  channels:
    - slug: ops-alerts
      channelId: ${SLACK_OPS_CHANNEL_ID:-C0123ABCD} # #ops-alerts
      tokenEnv: SLACK_BOT_TOKEN
    - slug: ops-summary
      channelId: C0789EFGH                          # #monitor-summary
      tokenEnv: SLACK_BOT_TOKEN
  userMapping:
    alice: U01ABCDEF12                              # @alice
    ops-team: S02ABCDEF34                           # @ops-team (subteam)

# ── Groups ────────────────────────────────────────────────────────────────────
groups:
  - slug: gateways
    friendlyName: Gateways
    description: Bastion, ingress controller, and other upstream dependencies
    color: "#0ea5e9"

  - slug: production-apis
    friendlyName: Production APIs
    description: Customer-facing API services
    color: "#ef4444"

  - slug: public
    friendlyName: Public Sites
    description: Public-facing websites and landing pages
    color: "#10b981"

  - slug: acme
    friendlyName: ACME
    description: ACME project namespaces (acme-* family)
    color: "#a855f7"

  - slug: kube-discovered                            # REQUIRED — fallback for ingresses without config.group
    friendlyName: Kube Discovered
    description: Auto-discovered ingresses that didn't specify a group

# ── Anchor host (ignored by validator) ────────────────────────────────────────
x-monitor-defaults: &staticDefaults
  httpMethod: GET
  acceptedStatusCodes: [200]
  interval: 5m
  timeout: 10s
  retries: 2
  retryBackoff: 5s
  followRedirects: false
  reminderInterval: 3d
  sslAlertThreshold: 30d
  sslEscalationThreshold: 7d
  sslReminderInterval: 3d
  slack: ops-alerts

# ── Static monitors ───────────────────────────────────────────────────────────
monitors:
  # An upstream gateway — checked more often, used as a parent for downstream monitors.
  - <<: *staticDefaults
    slug: bastion-proxy
    friendlyName: Bastion Proxy
    url: https://bastion.internal.example.com/health
    group: gateways
    interval: 1m
    notify: [ops-team]
    tags: [gateway, critical]

  # A legacy HTTP-only service. SSL fields can stay (from anchor) and are ignored.
  - <<: *staticDefaults
    slug: legacy-internal
    friendlyName: Legacy Internal Service
    url: http://legacy.internal.example.com/health
    group: production-apis
    dependsOn: [bastion-proxy]
    notify: [alice]
    tags: [legacy]

  # A heartbeat for an external SaaS we depend on. Custom timeouts for a slower endpoint.
  - <<: *staticDefaults
    slug: saas-status
    friendlyName: External SaaS Status
    url: https://api.external-saas.com/v1/status
    group: production-apis
    timeout: 30s
    retries: 1
    retryBackoff: 10s
    interval: 10m
    notify:
      - ops-team
      - "<!here>"                                    # raw Slack markup passes through

# Public status pages. Optional — omit this block to keep /status at
# an empty placeholder. Each entry has a required, unique `slug` and
# is served at /status/<slug>; /status itself renders an index of all
# configured pages. Each page renders sections of monitors selected
# by its match rules. Match selectors AND within a selector and OR
# across selectors. Selector fields:
#   - host:       glob (path.Match) against the monitor's URL host
#   - group:      exact slug equality (must reference a declared group)
#   - groupRegex: Go regexp against the monitor's group slug
#                 (mutually exclusive with `group` in the same selector)
#   - tags:       set overlap against monitors.tags
statusPages:
  - slug: public
    title: "Toggle status"
    showSections: true            # toggle the section headings on/off
    showIncidents: false          # off by default — recent alerts are sensitive
    sections:
      - title: "Public APIs"
        match:
          - host: "*.example.com"
          - group: gateways
      - title: "Toggle-prefixed services"
        match:
          - groupRegex: "^tc-.*$"
  - slug: internal
    title: "Internal tools"
    showSections: true
    sections:
      - title: "Internal tools"
        match:
          - tags: [internal-tools]
