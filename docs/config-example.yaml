# toggle-monitor — example config
# Reference for hand-writing your ConfigMap. See docs/config-schema.md for the per-field reference.

# ── Top-level ─────────────────────────────────────────────────────────────────
displayTimezone: Asia/Kathmandu
publicBaseURL: https://monitor.internal.example.com
dbBodyMaxChars: 4000

httpClient:
  userAgent: "toggle-monitor/0.1 (+https://github.com/toggle-corp/toggle-monitor)"

ui:
  pageSize:
    homepageAlerts: 20
    monitorListing: 50
    monitorHistory: 50
    discoveryListing: 50
  maxPerPage: 200

heartbeat:
  url: https://hc-ping.com/00000000-0000-0000-0000-000000000000
  interval: 1m
  failOnStalledWorker: true

# ── Database ──────────────────────────────────────────────────────────────────
# Non-secret values support ${VAR} interpolation (with optional defaults).
database:
  host: ${DB_HOST:-toggle-monitor-pg-rw.cnpg-system.svc.cluster.local}
  port: ${DB_PORT:-5432}
  user: ${DB_USER:-toggle_monitor}
  name: ${DB_NAME:-toggle_monitor}
  sslMode: require
  passwordEnv: DB_PASSWORD                          # secrets always via *Env, never inline

# ── Kube auto-discovery ───────────────────────────────────────────────────────
# `kube.match` is a *cascading rule tree*. For each (Ingress, host)
# pair, every rule whose `when:` matches contributes its `config:` to
# a merge stack; deeper / later wins for scalars, arrays union by
# default, `acceptedStatusCodes` replaces by default. Tag any array
# with `!override` to swap union for replace. `final: true` on a
# matching rule halts the cascade after descending into the rule's
# own `nested:` subtree. `ignore: true` suppresses materialization
# and records a `kube-ignored` row on /discovery.
#
# Full reference: docs/config-schema.md §4 and
# docs/adr/0002-kube-match-tree-cascade.md.
kube:
  resyncInterval: 30m

  # Ingress add/delete events trigger a reconcile after this window
  # instead of waiting out resyncInterval, so a removed ingress is torn
  # down before its 404 is reported as a fresh incident. The window also
  # collapses a burst (rolling deploy) into one pass and lets a
  # delete+recreate settle. 0s leaves resyncInterval as the only
  # trigger. Defaults to 5s when omitted; allowed range 1s-1m.
  watchDebounce: 5s

  # Auto-generated friendly name style for kube-discovered monitors.
  # Defaults to "compact" when omitted. Options:
  #   plain   → (ns) ingress-name                              (no magic)
  #   compact → (ns) ingress-name, with `-ingress` stripped    (default)
  #   dedupe  → also strip leading ingress tokens that already appear in ns
  #   title   → dedupe + Title Case With Spaces
  friendlyName: compact

  match:
    # ── Root rule (REQUIRED) ───────────────────────────────────────
    # Empty `when:` matches every (Ingress, host). Must carry every
    # required monitor field so any leaf-most match still produces a
    # valid monitor without additional input.
    - when: {}
      config:
        scheme: https
        path: /
        httpMethod: GET
        acceptedStatusCodes: [200]
        interval: 5m
        timeout: 10s
        retries: 2
        retryBackoff: 5s
        followRedirects: false
        reminderInterval: 3d
        sslAlertThreshold: 30d
        sslEscalationThreshold: 7d
        sslReminderInterval: 3d
        slack: ops-alerts
        notify: [ops-team]

    # ── Cluster-wide kill switch ───────────────────────────────────
    # Any Ingress labeled `monitor.togglecorp.com/disabled=true` is
    # suppressed. `final: true` prevents any later rule (e.g., an
    # app-specific override) from un-ignoring it.
    - when:
        labels:
          monitor.togglecorp.com/disabled: "true"
      ignore: true
      final: true

    # ── App-team opt-out by annotation (ADR-0014) ──────────────────
    # The same kill switch on the annotation channel, for charts that
    # template annotations more readily than labels. Nothing in the
    # binary knows this key — this rule is what gives it meaning, so
    # the capability is visible to whoever reviews this file. Skipped
    # hosts are listed under "Skipped ingresses" on /issues.
    - when:
        annotations:
          monitor.togglecorp.com/skip: "true"
      ignore: true
      final: true
    # The Namespace-scoped twin: the namespace owner opts out
    # everything the namespace contains.
    - when:
        namespaceAnnotations:
          monitor.togglecorp.com/skip: "true"
      ignore: true
      final: true

    # ── Skip short-lived test namespaces ───────────────────────────
    # `ignore:` cascades like a scalar, so a child can flip it back
    # to `false` to un-ignore a specific subset (e.g., test-critical-*).
    - when: { namespace: "test-*" }
      ignore: true

    # ── Acknowledge wildcard hosts ─────────────────────────────────
    # A wildcard Ingress host (`*.static.example.test`) is never
    # probeable and records `kube-invalid` by default. An ignore rule
    # acknowledges it: `kube-ignored` instead, off the /issues count.
    # `hostRegex` is auto-anchored, so this matches only hosts whose
    # leftmost label is `*`. See ADR-0012.
    - when: { hostRegex: '\*\..*' }
      ignore: true

    # ── ACME namespace family ──────────────────────────────────────
    # Tags accumulate down the tree (union by default): acme →
    # acme+service-a → acme+service-a+eoapi. Status-page sections
    # bind on these tags via tag-AND predicates (see statusPages
    # below).
    - when: { namespace: "acme-*" }
      config:
        notify: [alice]                              # unions with root's [ops-team]
        tags: [acme]
      nested:
        - when: { namespaceRegex: "acme-service-a-eoapi-\\d+" }
          config:
            tags: [service-a, eoapi]                 # unions → [acme, service-a, eoapi]
          nested:
            - when:
                labels:
                  app.kubernetes.io/name: minio
              config:
                path: /minio/health/live
                # `final: true` here prevents a later top-level
                # "global minio" rule (below) from clobbering the
                # project-specific `path` for this Ingress.
              final: true

    # ── Annotation value sources (ADR-0009) ────────────────────────
    # The cluster already declares some of its own monitoring data.
    # A `*From` block says "take this field's value from an
    # annotation"; the tree still decides *which* field is set where,
    # and the merge semantics are identical to the literal field.
    #
    # `path` is ingress-scoped — it genuinely varies within a
    # namespace (one ingress wants /livez, its neighbour wants
    # /minio/health/live). `notify` and `slack` are namespace-scoped:
    # they do not vary within a namespace, so one annotation on the
    # Namespace states the ownership map once for every ingress in it.
    #
    # A bad annotation value never costs monitoring: it is dropped
    # with a warning on /issues and the cascade value stands.
    - when: { namespace: "acme-*" }
      config:
        pathFrom:
          annotation: app.example.com/health-check
          default: /                                 # used when the ingress has no such annotation
        notifyOverrideFrom:
          namespaceAnnotation: app.example.com/notify   # replaces inherited notify at this position
        slackFrom:
          namespaceAnnotation: app.example.com/slack

    # ── BETACO namespace family ──────────────────────────────────────
    - when: { namespace: "betaco-core-backend-*" }
      config:
        tags: [betaco, internal]
        dependsOn: [bastion-proxy]
      nested:
        - when: { host: "*.example.com" }
          config:
            slack: ops-alerts
            notify: !override [ops-team, alice]      # replaces inherited notify, doesn't union

    # ── Global minio convention ────────────────────────────────────
    - when:
        labels:
          app.kubernetes.io/name: minio
      config:
        path: /minio/health/live
        acceptedStatusCodes: [200]                   # replace-by-default for this field

    # ── Public web fallback for dev-environment hosts ──────────────
    - when: { host: "*.example.com" }
      config:
        acceptedStatusCodes: [200, 301, 302]
        timeout: 15s
        retries: 3
        retryBackoff: 10s
        tags: [dev, public]

# ── Slack ─────────────────────────────────────────────────────────────────────
slack:
  bodyMaxChars: 200
  summaryChannel: ops-summary                       # weekly operational summary lands here
  channels:
    - slug: ops-alerts
      channelId: ${SLACK_OPS_CHANNEL_ID:-C0123ABCD} # #ops-alerts
      tokenEnv: SLACK_BOT_TOKEN
    - slug: ops-summary
      channelId: C0789EFGH                          # #monitor-summary
      tokenEnv: SLACK_BOT_TOKEN
    - slug: ops-critical
      channelId: C0ABC1234                          # #ops-critical (Alertmanager critical-severity)
      tokenEnv: SLACK_BOT_TOKEN
    - slug: ops-staging
      channelId: C0DEF5678                          # #ops-staging  (staging Alertmanager)
      tokenEnv: SLACK_BOT_TOKEN
  userMapping:
    alice: U01ABCDEF12                              # @alice
    ops-team: S02ABCDEF34                           # @ops-team (subteam)
  # Burst dispatcher (ADR-0004): every channel walks individual →
  # pending → group. Routine failures post immediately as per-monitor
  # messages; only a real burst (>= burstThreshold monitors down inside
  # burstWindow) collapses into one digest with @channel. Omit any
  # field to take its default.
  #
  # burstWindow must be wider than your widest monitors[].interval: the
  # scheduler jitters first ticks across a full interval, so an outage
  # trickles in over roughly one interval rather than arriving inside a
  # single pendingWait (ADR-0015).
  coalesce:
    pendingWait: 30s                                # pool wait before deciding individual vs group
    burstThreshold: 5                               # monitors down in burstWindow that promote to a digest; 0 disables
    burstWindow: 5m                                 # rolling window the burst count spans
    groupInterval: 5m                               # digest heartbeat (also resolve-debounce window)
    repeatInterval: 10m                             # group-mode still-down reminder cadence
    groupMention: channel                           # @channel on group open + reminder (channel | here | none)
    onDemandProbeTimeout: 5s                        # hot-parent probe budget at pendingWait expiry

# Self-health degraded mode (ADR-0008): when a cluster-internal DNS
# outage takes out the monitor's own resolver, *every* probe DNS-fails
# and treating that as N service outages pages the wrong people. Instead
# a burst of DNS failures across >= minMonitors distinct monitors (with
# zero successes) within `window` is suppressed into a single
# self-health notice. Omit the whole block to disable (individual DNS
# failures commit immediately, as today).
selfHealth:
  window: 90s                                       # W — rolling detect/decide window
  minMonitors: 3                                    # N_min — distinct DNS-failing monitors to trip (>= 2)
  channel: ops-alerts                               # self-health notice channel; omit → metric + log only
  mention: <!subteam^S02ABCDEF34>                   # optional @mention on the degraded notice

# ── Anchor host (ignored by validator) ────────────────────────────────────────
x-monitor-defaults: &staticDefaults
  httpMethod: GET
  acceptedStatusCodes: [200]
  interval: 5m
  timeout: 10s
  retries: 2
  retryBackoff: 5s
  followRedirects: false
  reminderInterval: 3d
  sslAlertThreshold: 30d
  sslEscalationThreshold: 7d
  sslReminderInterval: 3d
  slack: ops-alerts

# Shared branding anchor for status pages — keeps logo/color in one
# place so multiple pages for the same project share a look.
x-status-page-acme: &x-status-page-acme
  logoUrl: https://example.com/logo.svg
  color: "#f5333f"

# ── Static monitors ───────────────────────────────────────────────────────────
monitors:
  # An upstream gateway — checked more often, used as a parent for downstream monitors.
  - <<: *staticDefaults
    slug: bastion-proxy
    friendlyName: Bastion Proxy
    url: https://bastion.internal.example.com/health
    interval: 1m                                    # shared parents get a SHORT interval so push-propagation pauses dependents fast
    critical: true                                  # opt out of coalescing — the gateway itself pages immediately (pause still wins if ITS parent is down)
    notify: [ops-team]
    tags: [gateway, critical]

  # A legacy HTTP-only service. SSL fields can stay (from anchor) and are ignored.
  - <<: *staticDefaults
    slug: legacy-internal
    friendlyName: Legacy Internal Service
    url: http://legacy.internal.example.com/health
    dependsOn: [bastion-proxy]
    notify: [alice]
    tags: [legacy, internal]

  # A heartbeat for an external SaaS we depend on. Custom timeouts for a slower endpoint.
  - <<: *staticDefaults
    slug: saas-status
    friendlyName: External SaaS Status
    url: https://api.external-saas.com/v1/status
    timeout: 30s
    retries: 1
    retryBackoff: 10s
    interval: 10m
    notify:
      - ops-team
      - "<!here>"                                    # raw Slack markup passes through
    tags: [external, prod]

# ── SMTP monitors ─────────────────────────────────────────────────────────────
# Static-only SMTP probes: connect, read the banner, EHLO, optionally
# negotiate TLS (capturing the cert for the SSL state machine), QUIT.
# No auth, no mail sent. Share the slug namespace + dependsOn graph +
# status pages with HTTP monitors.
smtpMonitors:
  - slug: mail-relay
    friendlyName: Mail Relay
    host: smtp.example.test
    port: 2525
    tls: starttls                                    # starttls (default) | implicit | none
    interval: 5m
    timeout: 10s
    retries: 1
    retryBackoff: 5s
    reminderInterval: 3d
    slack: ops-alerts
    tags: [mail, prod]
    sslAlertThreshold: 14d
    sslEscalationThreshold: 3d
    sslReminderInterval: 24h

  - slug: mail-submission
    friendlyName: Mail Submission (implicit TLS)
    host: smtp.example.test
    port: 465
    tls: implicit
    interval: 5m
    timeout: 10s
    retries: 1
    retryBackoff: 5s
    reminderInterval: 3d
    slack: ops-alerts
    tags: [mail, prod]
    sslAlertThreshold: 14d
    sslEscalationThreshold: 3d
    sslReminderInterval: 24h

# ── Alertmanager webhook receiver ─────────────────────────────────────────────
# First-class receiver for Prometheus Alertmanager webhooks; replaces
# the PagerDuty pipe for k8s alerts. `match:` mirrors `kube.match`
# (cascade, !override, final, ignore — see ADR-0002 for the grammar).
# AM alerts are persisted per-fingerprint to `am_alerts` and posted to
# Slack; they don't participate in the monitor state machine.
#
# Full reference: docs/config-schema.md §5c and
# docs/adr/0005-alertmanager-webhook-receiver.md.
alertmanager:
  endpoint:
    path: /webhooks/alertmanager                       # one segment under the hardcoded /webhooks/ prefix
    tokenEnv: ALERTMANAGER_WEBHOOK_TOKEN               # Bearer token; env-resolved like every other secret
  retentionDays: 180                                   # daily sweeper purges resolved incidents older than this
  rateLimit:
    perChannel: 10                                     # flood threshold per Slack channel
    window: 30m                                        # sliding-window size
    noticeEvery: 1d                                    # min interval between flood-notice messages
  match:
    # ── Root rule (REQUIRED) ───────────────────────────────────────
    # Empty `when:` matches every alert. Must set `config.slack`
    # (every fingerprint inherits it). `notify` cascades by union.
    - when: {}
      config:
        slack: ops-alerts
        notify: [ops-team]

    # ── Ownership from the namespace (ADR-0013) ────────────────────
    # The same annotations kube.match reads, keyed off the alert's
    # `namespace` label. Namespace scope only, and this needs the
    # `kube:` block above — the Namespace informer is the watcher's.
    # `notifyFrom` unions with the root's notify; use
    # `notifyOverrideFrom` to replace it instead.
    #
    # Placed directly under the root on purpose: document order is
    # precedence, so a `when: {}` rule this far up is a baseline the
    # specific rules below (critical severity, staging externalURL)
    # still override. Last in the list it would silently beat them.
    - when: {}
      config:
        slackFrom:
          namespaceAnnotation: app.example.com/slack
        notifyFrom:
          namespaceAnnotation: app.example.com/notify
          # namespaceLabel: exported_namespace   # when an exporter relabels

    # ── Watchdog: ignore Prometheus's keep-alive rule ──────────────
    # `final: true` prevents any later rule (e.g., a catch-all
    # critical-severity branch) from un-ignoring it.
    - when: { alertname: "Watchdog" }
      ignore: true
      final: true

    # ── Critical severity → louder channel ─────────────────────────
    # `severity` is a glob value inside the per-key twin convention.
    - when:
        labels: { severity: "critical" }
      config:
        slack: ops-critical
        notify: !override [ops-team, "<!channel>"]     # replace inherited notify; broadcast on critical

    # ── Multi-Alertmanager via externalURL ─────────────────────────
    # Same endpoint, multiple AMs: discriminate by the payload
    # envelope's `externalURL` and route the staging AM elsewhere.
    - when:
        externalURL: "https://am.staging.example.test"
      config:
        slack: ops-staging

# ── Status pages ──────────────────────────────────────────────────────────────
# StatusPage is the sole collection entity since ADR-0003. Each entry
# is served at /status/<slug>; /status itself renders an index of all
# configured pages (in the order they appear below — operators control
# display order by ordering the YAML). Membership is
# tag-driven: each section has a single predicate node — a leaf
# (`tags:` AND-internally and/or `hostRegex:`) or a branch (`any:` /
# `all:` recursive composition). A monitor can land on many pages and
# many sections (N:M).
statusPages:
  - slug: local-only
    friendlyName: Local only
    description: Local-development hostnames; not for public sharing.
    sections:
      - title: ""
        match: { hostRegex: '.*\.local\.togglecorp\.com' }

  - slug: acme
    friendlyName: ACME
    description: Monitors for the ACME project.
    <<: *x-status-page-acme
    sections:
      - title: Production
        match:
          any:
            - { tags: [prod, acme] }
            - { tags: [prod, acme] }     # legacy name variant
      - title: Alpha
        match:
          any:
            - { tags: [alpha, acme] }
            - { tags: [alpha, acme] }

  - slug: acme-alpha
    friendlyName: ACME — Alpha
    description: Just the Alpha slice of the ACME project.
    <<: *x-status-page-acme
    sections:
      - title: Alpha
        match:
          any:
            - { tags: [alpha, acme] }
            - { tags: [alpha, acme] }

  - slug: betaco-alpha
    friendlyName: BETACO — Alpha
    description: BETACO Alpha environment.
    sections:
      - title: Alpha
        match: { tags: [alpha, betaco] }
