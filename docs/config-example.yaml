# toggle-monitor — example config
# Reference for hand-writing your ConfigMap. See docs/config-schema.md for the per-field reference.

# ── Top-level ─────────────────────────────────────────────────────────────────
displayTimezone: Asia/Kathmandu
publicBaseURL: https://monitor.internal.example.com
dbBodyMaxChars: 4000

httpClient:
  userAgent: "toggle-monitor/0.1 (+https://github.com/toggle-corp/toggle-monitor)"

ui:
  pageSize:
    homepageAlerts: 20
    monitorListing: 50
    monitorHistory: 50
    discoveryListing: 50
  maxPerPage: 200

theme:
  defaultGroupColor: "#64748b"

heartbeat:
  url: https://hc-ping.com/00000000-0000-0000-0000-000000000000
  interval: 1m
  failOnStalledWorker: true

# ── Database ──────────────────────────────────────────────────────────────────
# Non-secret values support ${VAR} interpolation (with optional defaults).
database:
  host: ${DB_HOST:-toggle-monitor-pg-rw.cnpg-system.svc.cluster.local}
  port: ${DB_PORT:-5432}
  user: ${DB_USER:-toggle_monitor}
  name: ${DB_NAME:-toggle_monitor}
  sslMode: require
  passwordEnv: DB_PASSWORD                          # secrets always via *Env, never inline

# ── Kube auto-discovery ───────────────────────────────────────────────────────
kube:
  annotationDomain: monitor.togglecorp.com
  resyncInterval: 30m
  pause:
    - host: api.foo.example.com
      reason: "Endpoint under maintenance until 2026-06-01"
    - host: "*.staging.example.com"

  # Auto-generated friendly name style for kube-discovered monitors.
  # Defaults to "compact" when omitted. Options:
  #   plain   → (ns) ingress-name                              (no magic)
  #   compact → (ns) ingress-name, with `-ingress` stripped    (default)
  #   dedupe  → also strip leading ingress tokens that already appear in ns
  #   title   → dedupe + Title Case With Spaces
  # Examples for ns=betaco-core-backend-1, name=core-backend-1-api:
  #   plain   → (betaco-core-backend-1) core-backend-1-api
  #   compact → (betaco-core-backend-1) core-backend-1-api
  #   dedupe  → (betaco-core-backend-1) api
  #   title   → (Betaco Core Backend 1) Api
  friendlyName: compact

  # Conditional preset resolution. Rules evaluated in declaration
  # order; first match wins. Both `namespace` and `host` are optional
  # globs (path.Match semantics — `*` matches any run of characters,
  # so `betaco-core-backend-*` matches `betaco-core-backend-1`). When
  # both fields are set on a rule, they AND together. A rule with
  # no `when:` clause is the wildcard fallback (must be the last
  # rule — anything after it is unreachable).
  #
  # Each rule must specify either `preset: <slug>` (materialize the
  # ingress with that preset) OR `ignore: true` (skip the ingress
  # entirely — no monitor, but a "kube-ignored" row still lands on
  # /discovery so you can verify the rule is firing).
  #
  # Resolution order overall:
  #   1. /kube.preset annotation (explicit)
  #   2. first matching match[] rule (preset OR ignore)
  #   3. otherwise → kube-invalid
  match:
    # Skip short-lived test namespaces entirely — they churn the UI on
    # every push and don't merit alerting.
    - when: { namespace: "test-*" }
      ignore: true
    - when: { namespace: "betaco-core-backend-*" }
      preset: internal-api
    - when: { namespace: "acme-*", host: "*.example.com" }
      preset: public-web
    - when: { host: "*.k8s.example.com" }
      preset: internal-api
    # Wildcard fallback — un-annotated ingresses that didn't match
    # any rule above land here. Omit this rule to keep the original
    # "kube-invalid: no preset annotation" behavior.
    - preset: public-web

  presets:
    - slug: internal-api
      scheme: https
      path: /health
      httpMethod: GET
      acceptedStatusCodes: [200]
      interval: 5m
      timeout: 10s
      retries: 2
      retryBackoff: 5s
      followRedirects: false
      reminderInterval: 3d
      sslAlertThreshold: 30d
      sslEscalationThreshold: 7d
      sslReminderInterval: 3d
      slack: ops-alerts
      notify: [alice]
      group: production-apis
      tags: [internal]
      dependsOn: [bastion-proxy]

    - slug: public-web
      scheme: https
      path: /
      httpMethod: GET
      acceptedStatusCodes: [200, 301, 302]
      interval: 5m
      timeout: 15s
      retries: 3
      retryBackoff: 10s
      followRedirects: false
      reminderInterval: 3d
      sslAlertThreshold: 30d
      sslEscalationThreshold: 7d
      sslReminderInterval: 3d
      slack: ops-alerts
      group: public

# ── Slack ─────────────────────────────────────────────────────────────────────
slack:
  bodyMaxChars: 200
  summaryChannel: ops-summary                       # weekly operational summary lands here
  channels:
    - slug: ops-alerts
      channelId: ${SLACK_OPS_CHANNEL_ID:-C0123ABCD} # #ops-alerts
      tokenEnv: SLACK_BOT_TOKEN
    - slug: ops-summary
      channelId: C0789EFGH                          # #monitor-summary
      tokenEnv: SLACK_BOT_TOKEN
  userMapping:
    alice: U01ABCDEF12                              # @alice
    ops-team: S02ABCDEF34                           # @ops-team (subteam)

# ── Groups ────────────────────────────────────────────────────────────────────
groups:
  - slug: gateways
    friendlyName: Gateways
    description: Bastion, ingress controller, and other upstream dependencies
    color: "#0ea5e9"

  - slug: production-apis
    friendlyName: Production APIs
    description: Customer-facing API services
    color: "#ef4444"

  - slug: public
    friendlyName: Public Sites
    description: Public-facing websites and landing pages
    color: "#10b981"

  - slug: kube-discovered                            # REQUIRED — fallback for ingresses without config.group
    friendlyName: Kube Discovered
    description: Auto-discovered ingresses that didn't specify a group

# ── Anchor host (ignored by validator) ────────────────────────────────────────
x-monitor-defaults: &staticDefaults
  httpMethod: GET
  acceptedStatusCodes: [200]
  interval: 5m
  timeout: 10s
  retries: 2
  retryBackoff: 5s
  followRedirects: false
  reminderInterval: 3d
  sslAlertThreshold: 30d
  sslEscalationThreshold: 7d
  sslReminderInterval: 3d
  slack: ops-alerts

# ── Static monitors ───────────────────────────────────────────────────────────
monitors:
  # An upstream gateway — checked more often, used as a parent for downstream monitors.
  - <<: *staticDefaults
    slug: bastion-proxy
    friendlyName: Bastion Proxy
    url: https://bastion.internal.example.com/health
    group: gateways
    interval: 1m
    notify: [ops-team]
    tags: [gateway, critical]

  # A legacy HTTP-only service. SSL fields can stay (from anchor) and are ignored.
  - <<: *staticDefaults
    slug: legacy-internal
    friendlyName: Legacy Internal Service
    url: http://legacy.internal.example.com/health
    group: production-apis
    dependsOn: [bastion-proxy]
    notify: [alice]
    tags: [legacy]

  # A heartbeat for an external SaaS we depend on. Custom timeouts for a slower endpoint.
  - <<: *staticDefaults
    slug: saas-status
    friendlyName: External SaaS Status
    url: https://api.external-saas.com/v1/status
    group: production-apis
    timeout: 30s
    retries: 1
    retryBackoff: 10s
    interval: 10m
    notify:
      - ops-team
      - "<!here>"                                    # raw Slack markup passes through

# Public /status page. Optional — omit this block to keep /status at
# an empty placeholder. When set, the page renders sections of
# monitors selected by the match rules. Match selectors AND within a
# selector and OR across selectors. Selector fields:
#   - host:       glob (path.Match) against the monitor's URL host
#   - group:      exact slug equality (must reference a declared group)
#   - groupRegex: Go regexp against the monitor's group slug
#                 (mutually exclusive with `group` in the same selector)
#   - tags:       set overlap against monitors.tags
statusPage:
  title: "Toggle status"
  showSections: true            # toggle the section headings on/off
  showIncidents: false          # off by default — recent alerts are sensitive
  sections:
    - title: "Public APIs"
      match:
        - host: "*.example.com"
        - group: gateways
    - title: "Toggle-prefixed services"
      match:
        - groupRegex: "^tc-.*$"
    - title: "Internal tools"
      match:
        - tags: [internal-tools]
