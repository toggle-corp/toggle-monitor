# Sample local-dev config for the docker-compose stack.
#
#   docker compose -f deploy/local/docker-compose.yaml up --build
#
# This config talks to the `postgres` service for storage and to the
# `upstream` (httpbin) service so you get something to probe out of
# the box. Adjust freely.

displayTimezone: UTC
publicBaseURL: http://localhost:8080
dbBodyMaxChars: 4000

database:
  host: postgres
  port: 5432
  user: toggle_monitor
  name: toggle_monitor
  sslMode: disable
  passwordEnv: DB_PASSWORD

ui:
  pageSize:
    homepageAlerts: 20
    monitorListing: 50
    monitorHistory: 50
    discoveryListing: 50
  maxPerPage: 200

httpClient:
  userAgent: "toggle-monitor/local-dev"

# Outbound deadman heartbeat — commented out by default. Point at
# healthchecks.io (or similar) to exercise it.
# heartbeat:
#   url: https://hc-ping.com/00000000-0000-0000-0000-000000000000
#   interval: 1m
#   failOnStalledWorker: true

# Kube auto-discovery — commented out by default; the local docker-
# compose stack doesn't run a k8s informer. Uncomment and run the
# binary against a kubeconfig (or `kubectl exec` inside a real
# cluster) to exercise the cascade. Schema rules:
#
#   * `match` is a tree. For each (Ingress, host) every rule whose
#     `when:` matches contributes its `config:` to a merge stack;
#     deeper / later wins for scalars, arrays union by default,
#     `acceptedStatusCodes` replaces by default.
#   * The first rule MUST have an empty `when:` and carry every
#     required-at-root field — it is the merge floor for any leaf-
#     most match.
#   * `final: true` on a matching rule descends into its own `nested:`
#     subtree and then halts the rest of the tree walk. Use it to
#     pin a project-specific override against a later global default.
#   * `ignore: true` suppresses materialization (a `kube-ignored` row
#     is still recorded on /discovery). A child can flip `ignore:
#     false` to un-ignore a specific subset.
#   * Selectors AND inside a `when:` (set both `namespace:` and
#     `labels:` to require both). Glob fields (`namespace`/`host`)
#     are path.Match; regex fields (`namespaceRegex`/`hostRegex`) are
#     Go regexp auto-anchored ^...$. Glob+regex on the same dimension
#     is a validation error.
#   * `!override` on an array swaps union for replace at that point in
#     the cascade. `!override []` clears the inherited list.
#
# kube:
#   resyncInterval: 30m
#   watchDebounce: 5s              # reconcile this long after an ingress add/delete; 0s disables
#   friendlyName: compact          # plain | compact | dedupe | title
#
#   match:
#     # ── Root (REQUIRED) ────────────────────────────────────────
#     # Empty `when:` matches every (Ingress, host); carries every
#     # required monitor field.
#     - when: {}
#       config:
#         scheme: https
#         path: /
#         httpMethod: GET
#         acceptedStatusCodes: [200]
#         interval: 5m
#         timeout: 10s
#         retries: 2
#         retryBackoff: 5s
#         followRedirects: false
#         reminderInterval: 3d
#         sslAlertThreshold: 30d
#         sslEscalationThreshold: 7d
#         sslReminderInterval: 3d
#         slack: ops-alerts
#         notify: [alice]
#
#     # ── Cluster-wide kill switch ───────────────────────────────
#     # Any Ingress labeled `monitor.togglecorp.com/disabled=true`
#     # is suppressed. `final: true` prevents a later rule (e.g. an
#     # app-specific override) from un-ignoring it.
#     - when:
#         labels:
#           monitor.togglecorp.com/disabled: "true"
#       ignore: true
#       final: true
#
#     # ── Skip ephemeral test namespaces ─────────────────────────
#     # `ignore:` cascades like a scalar — the nested rule flips it
#     # back to materialise critical test namespaces.
#     - when: { namespace: "test-*" }
#       ignore: true
#       nested:
#         - when: { namespace: "test-critical-*" }
#           ignore: false
#
#     # ── ACME namespace family (tag accumulation) ───────────────
#     # Tags union down the tree: acme → acme+service-a →
#     # acme+service-a+eoapi. Status-page sections (above) bind
#     # on these tags via tag-AND predicates.
#     - when: { namespace: "acme-*" }
#       config:
#         tags: [acme]
#         notify: [alice]                # unions with root [alice] (dedup)
#       nested:
#         - when: { namespaceRegex: "acme-service-a-eoapi-\\d+" }
#           config:
#             tags: [service-a, eoapi]   # → [acme, service-a, eoapi]
#           nested:
#             # Pin the minio health-check path for ingresses in this
#             # subtree. `final: true` blocks the global minio rule
#             # below from clobbering it.
#             - when:
#                 labels:
#                   app.kubernetes.io/name: minio
#               config:
#                 path: /minio/health/live
#               final: true
#
#     # ── BETACO: explicit notify replacement on prod hosts ────────
#     - when: { namespace: "betaco-*" }
#       config:
#         tags: [betaco, internal]
#       nested:
#         - when: { hostRegex: ".*\\.api\\.example\\.com" }
#           config:
#             # !override replaces the inherited notify list instead
#             # of unioning. Use sparingly — union is usually right.
#             notify: !override ["<!here>"]
#
#     # ── Global minio convention (any cluster-wide minio app) ───
#     # The project-specific rule above used `final: true` to opt
#     # out for its subtree.
#     - when:
#         labels:
#           app.kubernetes.io/name: minio
#       config:
#         path: /minio/health/live
#         # acceptedStatusCodes is replace-by-default (no !override
#         # needed) — append-by-union is almost always wrong for
#         # HTTP status codes.
#         acceptedStatusCodes: [200]
#
#     # ── Dev hosts: relax accepted codes + timing ───────────────
#     - when: { host: "*.example.com" }
#       config:
#         acceptedStatusCodes: [200, 301, 302]
#         timeout: 15s
#         retries: 3
#         retryBackoff: 10s
#         tags: [dev, public]

# Replace channelId + tokenEnv with real values to send actual Slack
# messages. Default token is a non-working placeholder so the binary
# starts (the auth.test failure becomes a warning, not a fatal).
slack:
  bodyMaxChars: 200
  channels:
    - slug: ops-alerts
      channelId: C0123ABCD
      tokenEnv: SLACK_BOT_TOKEN
  userMapping:
    alice: U0123ABCDEF

monitors:
  - slug: upstream-ok
    friendlyName: Upstream OK
    url: http://upstream/status/200
    tags: [local]
    httpMethod: GET
    acceptedStatusCodes: [200]
    interval: 30s
    timeout: 5s
    retries: 1
    retryBackoff: 2s
    followRedirects: false
    reminderInterval: 1h
    slack: ops-alerts

  - slug: upstream-flaky
    friendlyName: Upstream Flaky
    url: http://upstream/status/500
    tags: [local, flaky, demo]
    httpMethod: GET
    acceptedStatusCodes: [200]
    interval: 30s
    timeout: 5s
    retries: 1
    retryBackoff: 2s
    followRedirects: false
    reminderInterval: 1h
    slack: ops-alerts
    notify:
      - "<!here>"

# Shared branding anchor — pull logoUrl/color into one place so
# multiple pages for the same project look the same.
x-status-page-local: &x-status-page-local
  logoUrl: https://upload.wikimedia.org/wikipedia/commons/4/4e/Docker_%28container_engine%29_logo.svg
  color: "#2496ed"

# Status pages — see ADR-0003. Each section's `match` is a single
# predicate node:
#   - Leaf: { tags: [...] } and/or { hostRegex: '...' }. Tags AND
#     within the list (monitor must carry every listed tag); hostRegex
#     is a Go regexp auto-anchored ^...$ at use time, matched against
#     the monitor's URL host. A leaf with both ANDs them.
#   - Branch: { any: [...] } OR { all: [...] } — recurse to any depth.
#     Mixing both keys on the same node is a validation error.
# Slug must be kebab-case (^[a-z][a-z0-9]*(-[a-z0-9]+)*$); each page is
# rendered at /status/<slug>; /status renders an index of every page
# (alphabetical by friendlyName).
statusPages:
  # Plain leaf — simplest possible page.
  - slug: local-tags
    friendlyName: Local (tags)
    description: Single-leaf predicate matching by tag.
    <<: *x-status-page-local
    sections:
      - title: Local services
        match: { tags: [local] }
      - title: Flaky things
        match: { tags: [flaky] }

  # `any:` branch — OR across leaves. Useful for name variants
  # (legacy `acme` vs new `acme`, etc.).
  - slug: local-any
    friendlyName: Local (any-of variants)
    description: Matches either of two tag spellings via `any:`.
    sections:
      - title: Either spelling
        match:
          any:
            - { tags: [local] }
            - { tags: [demo] }

  # `all:` branch composed of mixed leaves — tags AND hostRegex.
  - slug: local-all
    friendlyName: Local (all-of)
    description: Demonstrates `all:` with a hostRegex + tag leaf.
    sections:
      - title: Local + matching host
        match:
          all:
            - { tags: [local] }
            - { hostRegex: 'upstream(:\d+)?' }   # auto-anchored ^...$

  # Nested branches — any-of-(all-of-…) is the canonical shape for
  # "(prod AND acme) OR (prod AND acme)" type rules.
  - slug: local-nested
    friendlyName: Local (nested any/all)
    description: any-of two AND-groups; also shows hostRegex alone.
    sections:
      - title: Tag combos
        match:
          any:
            - all:
                - { tags: [local] }
                - { tags: [demo] }
            - { tags: [flaky] }
      - title: Host-only selector
        match: { hostRegex: '.*upstream.*' }

  # Branding-only page — host-driven, no tags. Demonstrates `color:`
  # accent + logoUrl rendering at the top of /status/<slug>.
  - slug: local-branded
    friendlyName: Branded sample
    description: Same monitors as `local`, with logo + accent colour.
    <<: *x-status-page-local
    sections:
      - title: Upstream
        match: { hostRegex: 'upstream(:\d+)?' }
