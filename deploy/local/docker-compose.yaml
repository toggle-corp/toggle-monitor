# Local-dev stack: postgres + toggle-monitor + an upstream mock to
# poke at. Bring up with:
#
#   just dev-up      # or: docker compose -f deploy/local/docker-compose.yaml up --build
#
# Defaults assume nothing — every secret is pulled from deploy/local/.env
# (copy .env.example over to get started).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toggle_monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-toggle-monitor-dev}
      POSTGRES_DB: toggle_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toggle_monitor -d toggle_monitor"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Optional: a deliberately flaky upstream the sample config can probe.
  # Returns 200 most of the time and a periodic 500 so you can see the
  # alert state machine react. Built on the same docker image as a
  # generic httpbin would do.
  upstream:
    image: kennethreitz/httpbin:latest
    expose:
      - "80"

  # toggle-monitor itself. Two services run from the same image:
  #   - migrate: a one-shot job that applies pending migrations.
  #   - app:     the long-running serve loop, started once migrate exits.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-toggle-monitor-dev}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-dev-not-set}
    volumes:
      - ./config.yaml:/etc/toggle-monitor/config.yaml:ro
    command: ["migrate", "--config", "/etc/toggle-monitor/config.yaml"]
    restart: "no"

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-toggle-monitor-dev}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-dev-not-set}
      # Set KUBECONFIG_HOST in deploy/local/.env to the absolute path
      # of a kubeconfig on the host (e.g. ~/.kube/config). The mount
      # below makes it available inside the container at the same path
      # and the env var is read by `serve` when --kubeconfig is unset.
      # Leave empty to skip the kube informer entirely (kube: block in
      # config.yaml must also be unset / commented out).
      KUBECONFIG: ${KUBECONFIG_HOST:-}
    volumes:
      - ./config.yaml:/etc/toggle-monitor/config.yaml:ro
      # Mount the host's kubeconfig read-only into the container at
      # the same path. Empty KUBECONFIG_HOST short-circuits to /dev/null
      # so the bind doesn't error out.
      - ${KUBECONFIG_HOST:-/dev/null}:${KUBECONFIG_HOST:-/dev/null}:ro
    ports:
      - "8080:8080"
    # Default CMD (serve) is fine; override here if you want to flip
    # log levels or listen address.

volumes:
  postgres-data:
