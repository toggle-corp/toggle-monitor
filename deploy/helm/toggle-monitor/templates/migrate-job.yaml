apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "toggle-monitor.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.migrate.argoCDPreSyncHook }}
    # Run before each ArgoCD sync, before the new app pod rolls out.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    {{- else }}
    # Helm hook fallback for non-ArgoCD installs. PreInstall + PreUpgrade
    # so migrations apply before the new Deployment rolls out.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- end }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "toggle-monitor.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "toggle-monitor.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
            - --config
            - /etc/toggle-monitor/{{ .Values.config.existingConfigMap.key }}
          {{- with .Values.envFromSecrets }}
          env:
            {{- range . }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret.name }}
                  key: {{ .secret.key }}
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/toggle-monitor
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap.name | default (include "toggle-monitor.fullname" .) }}
