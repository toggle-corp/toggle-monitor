apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "toggle-monitor.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.migrate.argoCDPreSyncHook }}
    # Sync hook at wave -1: runs after SA/ConfigMap (wave -2) and before
    # the Deployment (wave 0). BeforeHookCreation forces a fresh Job on
    # every sync since Job specs are immutable.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
    {{- else }}
    # Helm hook fallback for non-ArgoCD installs. PreInstall + PreUpgrade
    # so migrations apply before the new Deployment rolls out.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- end }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "toggle-monitor.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      # No serviceAccountName: `migrate` reads the mounted config and
      # talks to Postgres, and touches no Kubernetes API, so it runs as
      # the namespace default. That also keeps it independent of the
      # chart's own ServiceAccount, which under the Helm-hook path below
      # would not exist yet when this pod is admitted.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
            - --config
            - /etc/toggle-monitor/{{ .Values.config.existingConfigMap.key }}
          {{- with .Values.envFromSecrets }}
          env:
            {{- range . }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret.name }}
                  key: {{ .secret.key }}
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/toggle-monitor
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap.name | default (include "toggle-monitor.fullname" .) }}
