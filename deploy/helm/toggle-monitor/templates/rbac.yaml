{{- if .Values.rbac.ingressWatch }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "toggle-monitor.fullname" . }}
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # Namespace annotations feed namespaceAnnotation-scoped *From value
  # sources in both cascades: kube.match (ADR-0009) and
  # alertmanager.match (ADR-0013). Required whenever either uses one.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "toggle-monitor.fullname" . }}
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "toggle-monitor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "toggle-monitor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
