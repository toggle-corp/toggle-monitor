{{/*
  Chart-managed Secrets are created ONLY when an external Secret name
  isn't supplied. Production deployments should set
  postgres.passwordSecret.name + slack.tokenSecret.name to point at
  Secrets managed by external-secrets / sealed-secrets / your secret
  store of choice — these inline fallbacks exist for dev convenience.
*/}}
{{- if and (not .Values.postgres.passwordSecret.name) .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toggle-monitor.fullname" . }}-db
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
---
{{- end }}
{{- if and (not .Values.slack.tokenSecret.name) .Values.slack.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toggle-monitor.fullname" . }}-slack
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  bot-token: {{ .Values.slack.token | quote }}
{{- end }}
