{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "toggle-monitor.serviceAccountName" . }}
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
  annotations:
    # Create before the migrate Job (wave -1) so its pod can resolve the SA.
    argocd.argoproj.io/sync-wave: "-2"
{{- end }}
