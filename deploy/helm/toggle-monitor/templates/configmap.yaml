{{/*
  Chart-managed ConfigMap. Skipped when the operator points at an
  externally-managed CM via `config.existingConfigMap.name`.

  Body is `toYaml .Values.config.inline` — no per-field templating —
  so any schema field the binary accepts flows through without chart
  changes. Anchors and `!override` tags do NOT survive this round-trip
  (Helm parses values.yaml into JSON-shaped Go data first); operators
  who need those features must use the existingConfigMap path.
*/}}
{{- if not .Values.config.existingConfigMap.name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "toggle-monitor.fullname" . }}
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
  annotations:
    # Create before the migrate Job (wave -1) so its volume mount resolves.
    argocd.argoproj.io/sync-wave: "-2"
data:
  {{ .Values.config.existingConfigMap.key }}: |
{{ toYaml .Values.config.inline | indent 4 }}
{{- end }}
