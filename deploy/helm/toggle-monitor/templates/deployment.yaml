apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toggle-monitor.fullname" . }}
  labels: {{- include "toggle-monitor.labels" . | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    # Stakater Reloader restarts the pod when a referenced ConfigMap or
    # Secret changes. Required for Secret rotation pickup, or for picking
    # up edits to an externally-managed ConfigMap.
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  # v1 is single-replica by design. Recreate strategy ensures the old
  # worker fully exits before the new one starts.
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "toggle-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "toggle-monitor.selectorLabels" . | nindent 8 }}
      {{- if not .Values.config.existingConfigMap.name }}
      annotations:
        # Hashes the rendered ConfigMap content so any helm upgrade that
        # changes the inline config triggers a rolling restart. Not
        # emitted when an external ConfigMap is mounted — the chart
        # can't see its data.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "toggle-monitor.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: toggle-monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config
            - /etc/toggle-monitor/{{ .Values.config.existingConfigMap.key }}
            - --listen
            - ":8080"
          {{- with .Values.envFromSecrets }}
          env:
            {{- range . }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret.name }}
                  key: {{ .secret.key }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe: {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe: {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/toggle-monitor
              readOnly: true
          # Give the worker enough time to drain in-flight checks +
          # emit the final shutdown heartbeat.
          terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap.name | default (include "toggle-monitor.fullname" .) }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
