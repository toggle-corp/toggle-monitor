# Default values for toggle-monitor.

image:
  repository: ghcr.io/toggle-corp/toggle-monitor
  tag: ""                                     # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# v1 is single-replica by design (the worker is a single in-process loop).
# Horizontal scale-out is deferred — keep this at 1 unless you know what
# you're doing. The Deployment uses strategy: Recreate so the old pod
# fully exits before the new one starts (avoids two workers racing).
replicas: 1

# Each entry projects a Secret key into an env var on both the serve
# Deployment and the migrate Job. The chart never creates Secrets —
# they must exist before `helm install`. Non-secret values that happen
# to live in a Secret (e.g. CNPG's `host` / `username` / `dbname` /
# `port` keys) bind here too; the binary consumes them via ${VAR}
# interpolation in config.inline.database.* below.
#
# See examples/values-cnpg.yaml for the full CNPG-mapping pattern.
envFromSecrets: []
# - name: DB_PASSWORD
#   secret:
#     name: toggle-monitor-db                 # or e.g. my-cnpg-cluster-app
#     key: password
# - name: SLACK_BOT_TOKEN
#   secret:
#     name: toggle-monitor-slack
#     key: bot-token
# - name: SENTRY_DSN                          # required when config.inline.sentry.enabled=true
#   secret:
#     name: toggle-monitor-sentry
#     key: dsn

# By default the Deployment carries a `checksum/config` annotation
# (sha256 of the rendered ConfigMap data) so any `helm upgrade` that
# changes the inline config triggers a rolling restart automatically.
# Set `reloader.enabled: true` ONLY if Stakater Reloader is installed
# cluster-wide AND you want pod restarts to also be triggered by Secret
# rotations or by edits to an externally-managed ConfigMap (the
# checksum mechanism can't cover those — chart doesn't own the data).
reloader:
  enabled: false

# The ServiceAccount the Deployment uses. With ingress auto-discovery
# enabled, it gets a cluster-wide ClusterRole granting
# get/list/watch on networking.k8s.io/v1 Ingress.
serviceAccount:
  create: true
  name: ""                                    # defaults to fullname template

rbac:
  # When kube auto-discovery is on, the ClusterRole + ClusterRoleBinding
  # are required. Set to false only if you scope discovery away
  # (i.e., you've removed the kube block from config).
  ingressWatch: true

# Config provisioning. Two paths, mutually exclusive:
#
#   - existingConfigMap.name unset → chart renders a ConfigMap from
#     `config.inline:` below. Quickstart-friendly, but YAML anchors are
#     expanded and `!override` tags / comments do NOT survive the
#     `toYaml` round-trip through values.yaml.
#
#   - existingConfigMap.name set → chart mounts that ConfigMap and
#     skips rendering. The named CM is owned by the operator
#     (kubectl/Kustomize/Argo). Full YAML fidelity preserved — use this
#     path if your config relies on anchors, `!override`, or inline
#     comments.
config:
  existingConfigMap:
    name: ""
    key: config.yaml                          # data key inside the CM; also the filename at mount time

  # Inline content rendered into a chart-managed ConfigMap when
  # `existingConfigMap.name` is empty. REPLACE_ME entries must be
  # overridden before the binary will start — see the schema in
  # docs/config-schema.md for the full reference.
  inline:
    displayTimezone: UTC
    publicBaseURL: ""                         # e.g. https://monitor.internal.example.com
    dbBodyMaxChars: 4000

    database:
      host: REPLACE_ME                        # e.g. my-cnpg-rw.cnpg-system.svc.cluster.local
      port: 5432
      user: toggle_monitor
      name: toggle_monitor
      sslMode: require
      passwordEnv: DB_PASSWORD

    ui:
      pageSize:
        homepageAlerts: 20
        monitorListing: 50
        monitorHistory: 50
        discoveryListing: 50
      maxPerPage: 200

    httpClient:
      userAgent: "toggle-monitor/0.1"

    # heartbeat:                              # optional; uncomment + edit to enable
    #   url: https://hc-ping.com/<uuid>
    #   interval: 1m
    #   failOnStalledWorker: true

    # sentry:                                 # optional; uncomment + edit to enable
    #   enabled: true
    #   dsnEnv: SENTRY_DSN                    # add a matching envFromSecrets entry above
    #   environment: production               # default: "production"
    #   sampleRate: 1.0                       # default: 1.0
    #   tracesSampleRate: 0.0                 # default: 0.0; performance tracing off in v1

    # Kube auto-discovery. `kube.match` is a cascading rule tree. The
    # root rule (empty `when:`) is REQUIRED and must carry every
    # required monitor field; leaf rules only override what differs.
    # See docs/config-example.yaml and ADR-0002 for the full model.
    kube:
      resyncInterval: 30m
      watchDebounce: 5s                       # reconcile after an ingress add/delete; 0s disables
      friendlyName: compact                   # plain | compact | dedupe | title
      match:
        - when: {}
          config:
            scheme: https
            path: /
            httpMethod: GET
            acceptedStatusCodes: [200]
            interval: 5m
            timeout: 10s
            retries: 2
            retryBackoff: 5s
            followRedirects: false
            reminderInterval: 3d
            sslAlertThreshold: 30d
            sslEscalationThreshold: 7d
            sslReminderInterval: 3d
            slack: ops-alerts
        - when: { namespace: "test-*" }
          ignore: true

    slack:
      bodyMaxChars: 200
      # summaryChannel: ops-summary           # optional; channel for the weekly operational summary
      # dependentsNoteMax: 50                 # optional override of the dependents-listing cap in alerts
      channels:
        - slug: ops-alerts
          channelId: REPLACE_ME               # e.g. C0123ABCD
          tokenEnv: SLACK_BOT_TOKEN
      userMapping: {}

    # proxies: []                             # optional; SOCKS5 proxies referenced by monitor `proxy:` slugs

    monitors: []

    # statusPages — see ADR-0003. Each section's `match` is a single
    # predicate node (leaf or branch).
    statusPages: []

# Container service + ingress for the UI. Restrict the ingress to your
# internal network — there is no auth in v1.
service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # Example: restrict to local network via nginx whitelist.
    # nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16"
  hosts:
    - host: monitor.internal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource requests + limits. Reasonable defaults for ~200 monitors.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# K8s probes use the binary's /healthz + /readyz endpoints.
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5

# Optional ServiceMonitor for kube-prometheus-stack. Off by default.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Optional PrometheusRule for kube-prometheus-stack. Off by default.
#
# These are the *self*-alerting rules: they alert on the
# misconfigurations toggle-monitor notices at runtime but cannot fix.
# Most mirror an /issues section (kube ingresses it can't materialize,
# Slack mappings that don't resolve, dependsOn typos, annotation values
# it had to reject); amValueSources alerts on a counter instead, since
# alertmanager routing has no /issues section.
# Requires serviceMonitor.enabled (or your own scrape config) so the
# toggle_monitor_issues gauge actually reaches Prometheus.
#
# Alerts route through your existing Alertmanager. If you point a
# receiver at toggle-monitor's own webhook endpoint, they also land on
# /alerts alongside every other alert it receives.
prometheusRule:
  enabled: false
  labels: {}

  # One toggle per /issues source. Severities are suggestions — the
  # ordering reflects blast radius: kube-invalid means something is not
  # being monitored at all, while a rejected annotation only means a
  # monitor fell back to its config-tree value.
  issues:
    kubeInvalid:
      enabled: true
      for: 15m
      severity: warning
    slackMapping:
      enabled: true
      for: 30m
      severity: warning
    missingParent:
      enabled: true
      for: 30m
      severity: info
    annotation:
      enabled: true
      for: 1h
      severity: info

  # Alertmanager-routing value sources (ADR-0013). Not an /issues source:
  # AM rules are evaluated per inbound alert, so there is no current set
  # to gauge — only events to count. `window` is the increase() range,
  # i.e. how long one rejection keeps the alert firing; keep `for` well
  # below it, or the alert can never trip (rejections arrive hours apart,
  # as often as Alertmanager re-delivers the offending alert).
  amValueSources:
    enabled: true
    window: 6h
    for: 0m
    severity: info

  # Catches "toggle-monitor itself is gone", which no /issues source can
  # report — while this fires, none of the rules above can.
  scrapeHealth:
    enabled: true
    for: 10m
    severity: critical

  # Appended verbatim to the rule group. Use for site-specific rules
  # that belong next to these.
  extraRules: []

# Optional Grafana dashboard, shipped as a ConfigMap and discovered by
# the kiwigrid k8s-sidecar (default in kube-prometheus-stack and the
# Grafana community chart). Pairs with the ServiceMonitor above —
# enable both if you want the metrics scraped AND a dashboard for them.
#
# The dashboard provides a hybrid operator/overview view:
#   Row 1  at-a-glance stats (monitors down, failure rate, freshness,
#          uptime, SSL sidebar)
#   Row 2  per-monitor triage table — sort by 'Up' desc to surface
#          anything down
#   Row 3  outcome / latency / state-timeline drilldowns, filtered
#          by the $monitor template variable
#   Row 4  runtime internals (collapsed by default)
#
# Tweak `title` and `uid` per environment if you run several
# toggle-monitor instances against the same Grafana — UIDs collide
# silently and the second dashboard quietly overwrites the first.
grafana:
  dashboard:
    enabled: false

    # Sidecar discovery. Both key and value must match your Grafana
    # install's sidecar config (kube-prometheus-stack defaults shown).
    label: grafana_dashboard
    labelValue: "1"
    # Optional Grafana folder. Empty = root.
    folder: ""

    # Dashboard identity. Override per environment for multi-cluster.
    title: "Toggle Monitor"
    uid: toggle-monitor-overview
    tags:
      - toggle-monitor
      - monitoring
      - uptime

    # Display defaults. `from` accepts any Grafana time expression
    # (now-6h, now-24h, now-7d, …).
    timeRange:
      from: "now-6h"
      to: "now"
    refresh: "30s"

    # Provisioned dashboards are immutable by default — UI edits drift
    # from the source-of-truth in git. Flip to true if you want
    # operators to be able to experiment without forking.
    editable: false

# ArgoCD sync hook: a one-shot Job that runs `toggle-monitor migrate`
# before the new app pod rolls out. Uses ArgoCD's Sync phase with
# sync-wave ordering (SA/ConfigMap at -2, this Job at -1, Deployment at 0)
# so the SA exists before the Job's pod starts. Disable if you're not on
# ArgoCD — the chart falls back to Helm pre-install/pre-upgrade hooks.
migrate:
  argoCDPreSyncHook: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
