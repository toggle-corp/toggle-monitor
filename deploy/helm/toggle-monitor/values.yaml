# Default values for toggle-monitor.

image:
  repository: ghcr.io/toggle-corp/toggle-monitor
  tag: ""                                     # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# v1 is single-replica by design (the worker is a single in-process loop).
# Horizontal scale-out is deferred — keep this at 1 unless you know what
# you're doing. The Deployment uses strategy: Recreate so the old pod
# fully exits before the new one starts (avoids two workers racing).
replicas: 1

# Each entry projects a Secret key into an env var on both the serve
# Deployment and the migrate Job. The chart never creates Secrets —
# they must exist before `helm install`. Non-secret values that happen
# to live in a Secret (e.g. CNPG's `host` / `username` / `dbname` /
# `port` keys) bind here too; the binary consumes them via ${VAR}
# interpolation in config.inline.database.* below.
#
# See examples/values-cnpg.yaml for the full CNPG-mapping pattern.
envFromSecrets: []
# - name: DB_PASSWORD
#   secret:
#     name: toggle-monitor-db                 # or e.g. my-cnpg-cluster-app
#     key: password
# - name: SLACK_BOT_TOKEN
#   secret:
#     name: toggle-monitor-slack
#     key: bot-token
# - name: SENTRY_DSN                          # required when config.inline.sentry.enabled=true
#   secret:
#     name: toggle-monitor-sentry
#     key: dsn

# By default the Deployment carries a `checksum/config` annotation
# (sha256 of the rendered ConfigMap data) so any `helm upgrade` that
# changes the inline config triggers a rolling restart automatically.
# Set `reloader.enabled: true` ONLY if Stakater Reloader is installed
# cluster-wide AND you want pod restarts to also be triggered by Secret
# rotations or by edits to an externally-managed ConfigMap (the
# checksum mechanism can't cover those — chart doesn't own the data).
reloader:
  enabled: false

# The ServiceAccount the Deployment uses. With ingress auto-discovery
# enabled, it gets a cluster-wide ClusterRole granting
# get/list/watch on networking.k8s.io/v1 Ingress.
serviceAccount:
  create: true
  name: ""                                    # defaults to fullname template

rbac:
  # When kube auto-discovery is on, the ClusterRole + ClusterRoleBinding
  # are required. Set to false only if you scope discovery away
  # (i.e., you've removed the kube block from config).
  ingressWatch: true

# Config provisioning. Two paths, mutually exclusive:
#
#   - existingConfigMap.name unset → chart renders a ConfigMap from
#     `config.inline:` below. Quickstart-friendly, but YAML anchors are
#     expanded and `!override` tags / comments do NOT survive the
#     `toYaml` round-trip through values.yaml.
#
#   - existingConfigMap.name set → chart mounts that ConfigMap and
#     skips rendering. The named CM is owned by the operator
#     (kubectl/Kustomize/Argo). Full YAML fidelity preserved — use this
#     path if your config relies on anchors, `!override`, or inline
#     comments.
config:
  existingConfigMap:
    name: ""
    key: config.yaml                          # data key inside the CM; also the filename at mount time

  # Inline content rendered into a chart-managed ConfigMap when
  # `existingConfigMap.name` is empty. REPLACE_ME entries must be
  # overridden before the binary will start — see the schema in
  # docs/config-schema.md for the full reference.
  inline:
    displayTimezone: UTC
    publicBaseURL: ""                         # e.g. https://monitor.internal.example.com
    dbBodyMaxChars: 4000

    database:
      host: REPLACE_ME                        # e.g. my-cnpg-rw.cnpg-system.svc.cluster.local
      port: 5432
      user: toggle_monitor
      name: toggle_monitor
      sslMode: require
      passwordEnv: DB_PASSWORD

    ui:
      pageSize:
        homepageAlerts: 20
        monitorListing: 50
        monitorHistory: 50
        discoveryListing: 50
      maxPerPage: 200

    httpClient:
      userAgent: "toggle-monitor/0.1"

    # heartbeat:                              # optional; uncomment + edit to enable
    #   url: https://hc-ping.com/<uuid>
    #   interval: 1m
    #   failOnStalledWorker: true

    # sentry:                                 # optional; uncomment + edit to enable
    #   enabled: true
    #   dsnEnv: SENTRY_DSN                    # add a matching envFromSecrets entry above
    #   environment: production               # default: "production"
    #   sampleRate: 1.0                       # default: 1.0
    #   tracesSampleRate: 0.0                 # default: 0.0; performance tracing off in v1

    # Kube auto-discovery. `kube.match` is a cascading rule tree. The
    # root rule (empty `when:`) is REQUIRED and must carry every
    # required monitor field; leaf rules only override what differs.
    # See docs/config-example.yaml and ADR-0002 for the full model.
    kube:
      resyncInterval: 30m
      friendlyName: compact                   # plain | compact | dedupe | title
      match:
        - when: {}
          config:
            scheme: https
            path: /
            httpMethod: GET
            acceptedStatusCodes: [200]
            interval: 5m
            timeout: 10s
            retries: 2
            retryBackoff: 5s
            followRedirects: false
            reminderInterval: 3d
            sslAlertThreshold: 30d
            sslEscalationThreshold: 7d
            sslReminderInterval: 3d
            slack: ops-alerts
        - when: { namespace: "test-*" }
          ignore: true

    slack:
      bodyMaxChars: 200
      # summaryChannel: ops-summary           # optional; channel for the weekly operational summary
      # dependentsNoteMax: 50                 # optional override of the dependents-listing cap in alerts
      channels:
        - slug: ops-alerts
          channelId: REPLACE_ME               # e.g. C0123ABCD
          tokenEnv: SLACK_BOT_TOKEN
      userMapping: {}

    # proxies: []                             # optional; SOCKS5 proxies referenced by monitor `proxy:` slugs

    monitors: []

    # statusPages — see ADR-0003. Each section's `match` is a single
    # predicate node (leaf or branch).
    statusPages: []

# Container service + ingress for the UI. Restrict the ingress to your
# internal network — there is no auth in v1.
service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # Example: restrict to local network via nginx whitelist.
    # nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16"
  hosts:
    - host: monitor.internal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource requests + limits. Reasonable defaults for ~200 monitors.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# K8s probes use the binary's /healthz + /readyz endpoints.
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5

# Optional ServiceMonitor for kube-prometheus-stack. Off by default.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# ArgoCD sync hook: a one-shot Job that runs `toggle-monitor migrate`
# before the new app pod rolls out. Uses ArgoCD's Sync phase with
# sync-wave ordering (SA/ConfigMap at -2, this Job at -1, Deployment at 0)
# so the SA exists before the Job's pod starts. Disable if you're not on
# ArgoCD — the chart falls back to Helm pre-install/pre-upgrade hooks.
migrate:
  argoCDPreSyncHook: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
