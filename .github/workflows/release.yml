name: release

on:
  push:
    tags:
      # Stable releases: 0.2.0
      - '[0-9]+.[0-9]+.[0-9]+'
      # Pre-releases: 0.2.0-dev1, 0.2.0-rc.1, 0.2.0-test, …
      # The hyphen suffix flags these as `prerelease: true` in
      # generate_release below.
      - '[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
    with:
      docker_push: true
      helm_push: true

  generate_release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Derive release version
        id: release
        shell: bash
        run: |
          release_version="${GITHUB_REF#refs/tags/}"
          # Hyphen in the tag (SemVer pre-release identifier) flags this
          # as a pre-release on the GitHub Releases page. Stable tags like
          # "0.2.0" stay false; "0.2.0-dev1", "0.2.0-rc.1" become true.
          is_prerelease=false
          if [[ "$release_version" == *-* ]]; then
            is_prerelease=true
          fi
          {
            echo "release_version=${release_version}"
            echo "is_prerelease=${is_prerelease}"
          } >> "$GITHUB_OUTPUT"

      # release.sh renders CHANGELOG.md and commits it in the tagged commit, so
      # the release notes are its topmost section. Re-rendering here with
      # `git-cliff --latest` instead would diverge: --latest resolves the
      # previous release to the adjacent tag, so a stable release cut right
      # after a `-dev` tag renders an empty body.
      - name: Extract the release notes
        shell: bash
        run: |
          awk '/^## /{ section++ } section == 1' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No release notes found in CHANGELOG.md"
            exit 1
          fi

      - name: Build extended changelog
        shell: bash
        run: |
          {
            echo "> [!NOTE]"
            echo "> Helm Repo URL: \`${{ needs.build.outputs.helm_repo_url }}\`"
            echo "> Helm Chart: \`${{ needs.build.outputs.helm_chart }}\`"
            echo "> Helm Target Revision: \`${{ needs.build.outputs.helm_target_revision }}\`"
            echo "> Docker image: \`${{ needs.build.outputs.docker_image }}\`"
            echo
            cat RELEASE_NOTES.md
          } > CHANGELOG.extended.md

          cat CHANGELOG.extended.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release.outputs.release_version }}
          body_path: CHANGELOG.extended.md
          prerelease: ${{ steps.release.outputs.is_prerelease }}
